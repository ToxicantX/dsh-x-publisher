# Adds the X publisher to a profile that includes the DSH Web services.
- insert:
    - id: authorization
      name: '@deepseek-ai/dsh-authorization'
      disabled: false

    - id: x-publisher
      name: dsh-x-publisher
      disabled: false
      config:
        clientId: !!js process.env.X_CLIENT_ID
        callbackPath: /x-publisher/oauth/callback
        startPath: /x-publisher/oauth/start
